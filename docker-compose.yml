services:
  db:
    image: postgres:17
    container_name: offerbound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: offerbound
      POSTGRES_PASSWORD: offerbound
      POSTGRES_DB: offerbound
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - offerbound_pgdata:/var/lib/postgresql/data
volumes:
  offerbound_pgdata:
